<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Feelings Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#BFE7FF;
    --sky-bottom:#FFE9C7;
    --heart-pink:#FF6B8A;
    --heart-pink-dark:#E14F6F;
    --heart-shine:#FFAFC2;
    --sun-yellow:#FFD34D;
    --leaf-green:#5FCB8B;
    --ink:#3A2E39;
    --card-white:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;overflow:hidden;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
    touch-action:manipulation;
  }
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    min-height:100vh;min-height:100dvh;
    padding:env(safe-area-inset-top,16px) env(safe-area-inset-right,16px) env(safe-area-inset-bottom,16px) env(safe-area-inset-left,16px);
    user-select:none;
  }

  /* ---------- header ---------- */
  header{
    text-align:center;
    padding-top:18px;
    width:100%;
  }
  .counter-card{
    display:inline-flex;
    align-items:center;
    gap:14px;
    background:var(--card-white);
    border-radius:32px;
    padding:10px 28px;
    box-shadow:0 8px 0 rgba(0,0,0,0.08), 0 14px 30px rgba(0,0,0,0.10);
  }
  .counter-number{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(48px,12vw,84px);
    color:var(--heart-pink-dark);
    line-height:1;
    min-width:1.2ch;
    text-align:center;
  }
  .counter-label{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:clamp(15px,3.6vw,20px);
    color:var(--ink);
    text-align:left;
    line-height:1.15;
  }
  .counter-label small{
    display:block;
    font-family:'Nunito',sans-serif;
    font-weight:600;
    font-size:0.62em;
    color:#8A7E8B;
  }

  /* ---------- stage ---------- */
  main{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .stage{
    position:relative;
    width:min(72vw,340px);
    height:min(72vw,340px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ghost-crease{
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.05));
  }
  .ghost-crease svg{width:100%;height:100%;}
  .ghost-crease.show{
    animation:ghostFade 2.6s ease-out forwards;
  }
  @keyframes ghostFade{
    0%{opacity:0.55;}
    100%{opacity:0;}
  }

  .heart-wrap{
    position:relative;
    width:100%;
    height:100%;
    cursor:pointer;
    transform-origin:50% 55%;
    will-change:transform,filter;
  }
  .heart-wrap svg{
    width:100%;
    height:100%;
    overflow:visible;
    filter:drop-shadow(0 12px 18px rgba(225,79,111,0.35));
  }
  .heart-wrap.spawn{
    animation:spawnIn 0.5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes spawnIn{
    0%{transform:scale(0.3) rotate(-8deg);opacity:0;}
    100%{transform:scale(1) rotate(0deg);opacity:1;}
  }

  /* tap bounce, stacked with stage state via inline transform */
  .heart-wrap.tap-bounce{ animation:tapBounce 0.22s ease-out; }
  @keyframes tapBounce{
    0%{transform:scale(1);}
    35%{transform:scale(0.88) rotate(-2deg);}
    100%{transform:scale(1);}
  }

  .heart-wrap.stage-1 svg{ filter:drop-shadow(0 12px 18px rgba(225,79,111,0.35)) brightness(0.99); }
  .heart-wrap.stage-2 svg{ filter:drop-shadow(0 10px 14px rgba(225,79,111,0.35)) brightness(0.97); }
  .heart-wrap.stage-3 svg{ filter:drop-shadow(0 8px 12px rgba(225,79,111,0.35)) brightness(0.94) contrast(1.03); }
  .heart-wrap.stage-4 svg{ filter:drop-shadow(0 6px 10px rgba(225,79,111,0.35)) brightness(0.90) contrast(1.06); }

  .heart-wrap.stage-1{ transform:scale(0.97) rotate(-1.5deg) skewX(1deg); }
  .heart-wrap.stage-2{ transform:scale(0.93) rotate(3deg) skewX(-2deg); }
  .heart-wrap.stage-3{ transform:scale(0.86) rotate(-5deg) skewX(3deg) skewY(-1deg); }
  .heart-wrap.stage-4{ transform:scale(0.78) rotate(7deg) skewX(-4deg) skewY(2deg); }

  .heart-wrap.crumpled{
    animation:crumpleFinal 0.6s cubic-bezier(.55,0,.68,.35) forwards;
  }
  @keyframes crumpleFinal{
    0%{ transform:scale(0.78) rotate(7deg) skewX(-4deg) skewY(2deg); filter:drop-shadow(0 6px 10px rgba(225,79,111,0.35)) brightness(0.9); }
    40%{ transform:scale(0.42) rotate(35deg) skewX(-14deg) skewY(10deg); filter:brightness(0.8) contrast(1.15); }
    100%{ transform:scale(0.3) rotate(78deg) skewX(2deg) skewY(-2deg); filter:brightness(0.66) contrast(1.25); opacity:1; }
  }

  /* healing stages: tapping/clicking gradually unfolds the crumpled heart */
  .heart-wrap{
    transition:transform 0.45s cubic-bezier(.34,1.1,.64,1), filter 0.45s ease;
  }
  .heart-wrap.heal-1{ transform:scale(0.5) rotate(48deg) skewX(-6deg); filter:brightness(0.8) contrast(1.15); }
  .heart-wrap.heal-2{ transform:scale(0.78) rotate(18deg) skewX(-2deg); filter:brightness(0.92) contrast(1.05); }
  .heart-wrap.heal-3{ transform:scale(1) rotate(0deg) skewX(0deg); filter:drop-shadow(0 12px 18px rgba(225,79,111,0.35)) brightness(1); }

  .crease-line{
    stroke:var(--heart-pink-dark);
    stroke-linecap:round;
    fill:none;
    opacity:0;
    transition:opacity 0.35s ease;
  }
  .heart-wrap.stage-1 .c1{opacity:0.35;}
  .heart-wrap.stage-2 .c1{opacity:0.55;} .heart-wrap.stage-2 .c2{opacity:0.35;}
  .heart-wrap.stage-3 .c1,.heart-wrap.stage-3 .c2{opacity:0.6;} .heart-wrap.stage-3 .c3{opacity:0.45;}
  .heart-wrap.stage-4 .c1,.heart-wrap.stage-4 .c2,.heart-wrap.stage-4 .c3{opacity:0.7;} .heart-wrap.stage-4 .c4{opacity:0.55;}
  .heart-wrap.crumpled .c1,.heart-wrap.crumpled .c2,.heart-wrap.crumpled .c3,.heart-wrap.crumpled .c4{opacity:0.8;}
  .heart-wrap.heal-1 .c1,.heart-wrap.heal-1 .c2,.heart-wrap.heal-1 .c3,.heart-wrap.heal-1 .c4{opacity:0.65;}
  .heart-wrap.heal-2 .c1,.heart-wrap.heal-2 .c3{opacity:0.4;} .heart-wrap.heal-2 .c2,.heart-wrap.heal-2 .c4{opacity:0;}

  /* the one or two creases that never fully go away, once a heart has been healed */
  .scar-line{ opacity:0; transition:opacity 0.8s ease; }
  .heart-wrap.heal-3.scarred .scar-line{ opacity:0.3; }

  .sparkle{
    position:absolute;
    inset:-14%;
    pointer-events:none;
  }

  /* ---------- footer ---------- */
  footer{
    text-align:center;
    padding-bottom:10px;
    max-width:520px;
  }
  .hint{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:clamp(14px,3.4vw,17px);
    color:#6B5B6E;
    background:rgba(255,255,255,0.6);
    display:inline-block;
    padding:8px 18px;
    border-radius:20px;
  }
  .hint[hidden]{ display:none; }

  .heal-btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(16px,4vw,20px);
    color:#6B4E12;
    background:var(--sun-yellow);
    border:none;
    border-radius:28px;
    padding:12px 30px;
    box-shadow:0 6px 0 rgba(0,0,0,0.12), 0 10px 20px rgba(0,0,0,0.10);
    cursor:pointer;
    touch-action:manipulation;
    animation:btnPop 0.35s cubic-bezier(.34,1.56,.64,1) both;
  }
  .heal-btn:active{ transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,0.12); }
  @keyframes btnPop{
    0%{ transform:scale(0.6); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .heart-wrap,.heart-wrap.crumpled,.ghost-crease.show,.heart-wrap.tap-bounce,.heart-wrap.spawn{
      animation-duration:0.01ms !important;
    }
  }
</style>
</head>
<body>

<header>
  <div class="counter-card">
    <div class="counter-number" id="counterNum">0</div>
    <div class="counter-label">Ouch!<br>Feelings hurt<small id="dateLabel">today</small></div>
  </div>
</header>

<main>
  <div class="stage" id="stage">
    <div class="ghost-crease" id="ghostCrease"></div>
    <div class="heart-wrap spawn stage-0" id="heartWrap">
      <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartFill" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF93A8"/>
            <stop offset="55%" stop-color="var(--heart-pink)"/>
            <stop offset="100%" stop-color="var(--heart-pink-dark)"/>
          </linearGradient>
        </defs>
        <path d="M100,170
                 C 20,120 0,75 0,45
                 C 0,15 25,-2 52,5
                 C 72,10 90,28 100,45
                 C 110,28 128,10 148,5
                 C 175,-2 200,15 200,45
                 C 200,75 180,120 100,170 Z"
              fill="url(#heartFill)" stroke="var(--heart-pink-dark)" stroke-width="3"/>
        <path class="crease-line c1" d="M60,40 L120,95" stroke-width="4"/>
        <path class="crease-line c2" d="M140,35 L80,110" stroke-width="4"/>
        <path class="crease-line c3" d="M45,70 L150,60" stroke-width="3"/>
        <path class="crease-line c4" d="M75,20 L95,140" stroke-width="3"/>
        <path class="crease-line scar-line" d="M65,45 L110,90" stroke-width="2.5"/>
        <path class="crease-line scar-line" d="M130,50 L95,115" stroke-width="2.5"/>
      </svg>
    </div>
  </div>
</main>

<footer>
  <div class="hint" id="hintText">Tap the heart 💗</div>
  <button class="heal-btn" id="healBtn" type="button" hidden>💛 Smooth it out</button>
</footer>

<script>
(function(){
  var heartWrap = document.getElementById('heartWrap');
  var stage = document.getElementById('stage');
  var counterNum = document.getElementById('counterNum');
  var hintText = document.getElementById('hintText');
  var ghostCrease = document.getElementById('ghostCrease');
  var healBtn = document.getElementById('healBtn');

  var STORAGE_KEY = 'feelingsHeartTally';
  var TAPS_TO_BREAK = 5;
  var TAPS_TO_HEAL = 3;
  var taps = 0;
  var healTaps = 0;
  var mode = 'fresh'; // 'fresh' -> 'crumpled' -> 'healing' -> (new heart)
  var busy = false; // locks input during animated transitions

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }

  function loadCount(){
    try{
      var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if(raw.day === todayKey()) return raw.count || 0;
      return 0;
    }catch(e){ return 0; }
  }

  function saveCount(n){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({day: todayKey(), count: n}));
    }catch(e){}
  }

  var count = loadCount();
  var countDay = todayKey();
  counterNum.textContent = count;

  // daily reset: catches midnight rollover even if the page is left open
  function checkDailyReset(){
    var key = todayKey();
    if(key !== countDay){
      countDay = key;
      count = 0;
      saveCount(count);
      counterNum.textContent = count;
    }
  }
  window.setInterval(checkDailyReset, 30000);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) checkDailyReset();
  });

  function heartMarkup(){
    return heartWrap.innerHTML;
  }

  function newHeart(showGhost){
    checkDailyReset();
    var fresh = document.createElement('div');
    fresh.className = 'heart-wrap spawn stage-0';
    fresh.id = 'heartWrap';
    fresh.innerHTML = heartWrap.innerHTML;

    if(showGhost){
      ghostCrease.innerHTML = heartMarkup();
      ghostCrease.classList.remove('show');
      void ghostCrease.offsetWidth; // restart animation
      ghostCrease.classList.add('show');
    }

    heartWrap.remove();
    stage.insertBefore(fresh, ghostCrease.nextSibling);
    heartWrap = fresh;
    attachListeners(heartWrap);

    taps = 0;
    healTaps = 0;
    mode = 'fresh';
    busy = false;
    healBtn.hidden = true;
    hintText.hidden = false;
    hintText.textContent = 'Tap the heart 💗';
  }

  function setCrumpleStage(n){
    heartWrap.className = 'heart-wrap tap-bounce stage-' + n;
    window.setTimeout(function(){
      if(heartWrap) heartWrap.classList.remove('tap-bounce');
    }, 230);
  }

  function handleBreakTap(e){
    e.preventDefault();
    taps++;

    if(taps >= TAPS_TO_BREAK){
      busy = true;
      mode = 'crumpled';
      heartWrap.className = 'heart-wrap crumpled';

      count++;
      saveCount(count);
      counterNum.textContent = count;

      window.setTimeout(function(){
        busy = false;
        hintText.textContent = 'Can it be made better?';
        healBtn.hidden = false;
      }, 650);
    } else {
      setCrumpleStage(taps);
      var remaining = TAPS_TO_BREAK - taps;
      hintText.textContent = remaining === 1 ? 'One more...' : 'Keep going...';
    }
  }

  function handleHealTap(e){
    if(e) e.preventDefault();
    if(busy || mode !== 'crumpled') return;

    healTaps++;
    heartWrap.classList.remove('tap-bounce');
    void heartWrap.offsetWidth;
    heartWrap.classList.add('heal-' + healTaps);
    heartWrap.classList.add('tap-bounce');

    if(healTaps >= TAPS_TO_HEAL){
      busy = true;
      mode = 'healing';
      healBtn.hidden = true;

      window.setTimeout(function(){
        heartWrap.classList.add('scarred');
        hintText.hidden = false;
        hintText.textContent = 'Better \u2014 but the wrinkles are still there';
      }, 250);

      window.setTimeout(function(){
        newHeart(true);
      }, 2400);
    } else {
      hintText.textContent = 'Smoothing it out...';
    }
  }

  function handleTap(e){
    if(busy) return;
    if(mode === 'fresh') handleBreakTap(e);
    else if(mode === 'crumpled') handleHealTap(e);
  }

  function attachListeners(el){
    el.addEventListener('pointerdown', handleTap, {passive:false});
  }

  attachListeners(heartWrap);
  healBtn.addEventListener('pointerdown', handleHealTap, {passive:false});
  healBtn.addEventListener('click', function(e){ e.preventDefault(); });

  // safety: prevent double-tap zoom / context menu weirdness on mobile
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
</script>

</body>
</html>
